[project]
name = "gradualbench"
version = "0.1.0"
description = "LLM evaluation framework with persistent storage and resumable operations"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "sqlalchemy>=2.0.0",
    "click>=8.0.0",
    "openai>=1.0.0",
    "datasets>=2.0.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[project.scripts]
gradualbench = "gradualbench.cli:cli"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
